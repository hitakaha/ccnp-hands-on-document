site_name: CCNP ENCOR ハンズオン (30分) - インフラストラクチャ
site_description: CCNP ENCOR 350-401 インフラストラクチャ (レイヤ2 / レイヤ3 / IPサービス) を30分で駆け抜けるハンズオンコース
docs_dir: src
site_dir: docs
use_directory_urls: true

theme:
  name: material
  language: ja
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え

plugins:
  - search:
      lang: ja
      separator: '[\s\u200b\-]'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - ホーム: index.md
  - "0. ラボ準備": 00-lab-setup.md
  - "3.1 レイヤ 2": 31-layer2.md
  - "3.2 レイヤ 3": 32-layer3.md
  - "3.3 IP サービス": 33-ip-services.md
  - "まとめ・確認問題": 99-summary.md
